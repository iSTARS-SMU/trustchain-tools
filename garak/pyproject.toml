[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustchain-tool-garak"
version = "0.1.0"
description = "TrustChain Pentest garak tool — LLM safety probe orchestrator wrapper."
requires-python = ">=3.11"
# garak's transitive dep mistralai (~1.5+) requires pydantic>=2.9; we pin
# pydantic>=2.9,<3 so resolver can satisfy fastapi's <3.0 ceiling and
# garak's modern transitives in one version.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.9,<3",
    "garak>=0.15.0,<0.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
